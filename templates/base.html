<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
          <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Courier+New&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}">

</head>
<body>
  <header class="{{ page_style }}">

    <div class="logo">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo">
    </div>
    <nav>
      <a href="{{ url_for('home')}}">Home</a>
      <a href="{{ url_for('bot')}}">Bot</a>
      <a href="{{ url_for('realbid')}}">Bid</a>
      <a href="{{ url_for('faq') }}">FAQ</a>
      <a href="{{ url_for('login') }}">Login</a>
    </nav>
  </header>
<main>
    {% block content %}
    {% endblock %}
</main>
<footer class="footer {{ page_style }}">
  <div class="footer-content">
          <!-- Logo and Copyright -->
          <div class="footer-logo">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" class="logo" />
            <p>© 2025 RideAuct, Inc.<br>All rights reserved.</p>
          </div>

          <!-- Links: Quick, Company, Resources -->
          <div class="footer-links">
            <div>
              <h4>Quick Links</h4>
              <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">Contact</a></li>
              </ul>
            </div>
            <div>
              <h4>Company</h4>
              <ul>
                <li><a href="#">Partners</a></li>
                <li><a href="#">Events</a></li>
                <li><a href="#">FAQ</a></li>
                <li><a href="#">Support</a></li>
              </ul>
            </div>
            <div>
              <h4>Resources</h4>
              <ul>
                <li><a href="#">Blog</a></li>
                <li><a href="#">Terms</a></li>
                <li><a href="#">Privacy</a></li>
                <li><a href="#">Sitemap</a></li>
              </ul>
            </div>
          </div>
        </div>
      </footer>

</body>
</html>
