<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIVA Chatbot</title>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Courier+New&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
        }
        
        body {
            background-color: #fef4e8;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
        }
        /* Navbar styles from Code 1 */
        
        header {
            background-color: #d9dacc;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            width: 100%;
        }
        
        .logo {
            display: flex;
            align-items: center;
            font-size: 1.6rem;
            font-weight: 700;
            color: #000;
        }
        
        .logo img {
            width: 300px;
            margin-right: 10px;
        }
        
        nav {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            font-weight: 500;
        }
        
        nav a {
            text-decoration: none;
            color: #444;
            font-size: 1rem;
            transition: color 0.3s;
        }
        
        nav a:hover {
            color: #000;
        }
        
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('path/to/your/logo.avif') no-repeat center center;
            background-size: contain;
            opacity: 0.1;
            z-index: -1;
        }
        
        .chat-container {
            width: 95%;
            max-width: 900px;
            height: 80vh;
            flex-grow: 1;
            background-color: #fef4e8;
            border: 1px solid #ccc;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1rem;
            border-radius: 10px;
            overflow-y: auto;
            position: relative;
            z-index: 1;
            margin: 20px auto;
        }
        
        .chat-header-container {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #2f4023;
            padding: 10px;
            position: sticky;
            top: 0;
            z-index: 1;
            border-radius: 10px;
        }
        
        .chat-header {
            color: #fff;
            font-weight: bold;
            font-size: 1.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: center;
            padding: 6px;
        }
        
        .model-btn {
            background-color: #3f5232;
            color: #fff;
            padding: 8px 16px;
            border: none;
            border-radius: 999px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .main-heading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #d6cbb9;
            pointer-events: none;
            z-index: -2;
            width: 100%;
        }
        
        .main-heading h1 {
            font-size: 4rem;
            font-weight: bold;
            letter-spacing: 2px;
        }
        
        .main-heading h2 {
            font-size: 1.5rem;
            font-weight: normal;
            letter-spacing: 1px;
            margin-top: -10px;
        }
        
        .prompts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 10px;
            margin: 1rem 0;
        }
        
        .prompt {
            background-color: transparent;
            border: 1px solid #d6cbb9;
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
            text-align: left;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        .prompt:hover {
            background-color: #f6ebdb;
        }
        
        .prompt small {
            color: #7a7262;
            font-size: 12px;
        }
        
        .chat-footer {
            display: flex;
            border-top: 1px solid #ddd;
            padding-top: 1rem;
            gap: 10px;
        }
        
        .chat-footer input {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #d6cbb9;
            border-radius: 10px;
            outline: none;
        }
        
        .mic-btn {
            background-color: #3f5232;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }
        
        .send-btn {
            background-color: #2f4023;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }
        
        .message {
            max-width: 70%;
            padding: 10px 14px;
            margin: 10px 0;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
        }
        
        .user {
            background-color: #d7edc3;
            align-self: flex-end;
            margin-left: auto;
            text-align: right;
        }
        
        .bot {
            background-color: #f0e8dc;
            align-self: flex-start;
            margin-right: auto;
            text-align: left;
        }
        /* Footer styles from Code 1 */
        
        .footer {
            background-color: #fffef2;
            padding: 40px;
            color: #333;
            border-top: 1px solid #ccc;
            width: 100%;
        }
        
        .footer-content {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            max-width: 1200px;
            margin: auto;
        }
        
        .footer-logo {
            flex: 1;
            margin-bottom: 20px;
        }
        
        .footer-logo .logo {
            width: 320px;
            margin-bottom: 50px;
        }
        
        .footer-links {
            display: flex;
            flex: 2;
            justify-content: space-between;
            min-width: 300px;
            gap: 50px;
            flex-wrap: wrap;
        }
        
        .footer-links h4 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #333;
        }
        
        .footer-links ul {
            list-style: none;
            padding: 0;
        }
        
        .footer-links ul li {
            margin-bottom: 8px;
        }
        
        .footer-links ul li a {
            text-decoration: none;
            color: #333;
            transition: 0.2s ease;
        }
        
        .footer-links ul li a:hover {
            text-decoration: underline;
        }
        /* Responsive styles */
        
        @media (max-width: 768px) {
            header {
                padding: 20px;
                flex-direction: column;
                gap: 15px;
            }
            .logo {
                font-size: 1.3rem;
            }
            nav {
                gap: 15px;
                justify-content: center;
            }
            .main-heading h1 {
                font-size: 3rem;
            }
            .chat-header {
                font-size: 1.2rem;
            }
            .footer-content {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .footer-links {
                justify-content: center;
                gap: 30px;
            }
        }
        
        @media (max-width: 480px) {
            .main-heading h1 {
                font-size: 2.5rem;
            }
            .main-heading h2 {
                font-size: 1.2rem;
            }
            .footer {
                padding: 30px 20px;
            }
            .footer-links {
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>

<body>
    <!-- Navbar from Code 1 -->
    <header>
        <div class="logo">
            <img src="{{url_for('static', filename='images/logo.png') }}" alt="Logo">
        </div>
        <nav>
            <a href="{{ url_for('home')}}">Home</a>
            <a href="{{ url_for('bot')}}">Bot</a>
            <a href="{{ url_for('realbid')}}">Bid</a>
            <a href="{{ url_for('faq') }}">FAQ</a>
            <a href="{{ url_for('login') }}">Login</a>
        </nav>
    </header>

    <!-- Chat container -->
    <div class="chat-container">
        <div class="chat-header-container">
            <div class="chat-header">Ask Me Anything About Cars!</div>
        </div>

        <!-- Fixed Center Background Heading -->
        <div class="main-heading">
            <h1>AR</h1>
            <h2>CHATBOT</h2>
        </div>

        <div class="chat-footer">
            <input type="text" placeholder="Send a message..." />
            <button class="mic-btn">🎤</button>
            <button class="send-btn">➤</button>
        </div>
    </div>

    <!-- Footer from Code 1 -->
    <footer class="footer">
        <div class="footer-content">
            <!-- Logo and Copyright -->
            <div class="footer-logo">
                <img src="logo.png" alt="Logo" class="logo" />
                <p>© 2025 RideAuct, Inc.<br>All rights reserved.</p>
            </div>

            <!-- Links: Quick, Company, Resources -->
            <div class="footer-links">
                <div>
                    <h4>Quick Links</h4>
                    <ul>
                        <li><a href="#">Home</a></li>
                        <li><a href="#">About</a></li>
                        <li><a href="#">Products</a></li>
                        <li><a href="#">Contact</a></li>
                    </ul>
                </div>
                <div>
                    <h4>Company</h4>
                    <ul>
                        <li><a href="#">Partners</a></li>
                        <li><a href="#">Events</a></li>
                        <li><a href="#">FAQ</a></li>
                        <li><a href="#">Support</a></li>
                    </ul>
                </div>
                <div>
                    <h4>Resources</h4>
                    <ul>
                        <li><a href="#">Blog</a></li>
                        <li><a href="#">Terms</a></li>
                        <li><a href="#">Privacy</a></li>
                        <li><a href="#">Sitemap</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // Replace this with your actual Gemini API key
        const GEMINI_API_KEY = "AIzaSyB5qUBYtuMMFUloOA5gRnpC-Br-aYaD4tc";

        const micBtn = document.querySelector(".mic-btn");

        if (!("webkitSpeechRecognition" in window)) {
            micBtn.disabled = true;
            micBtn.title = "Speech recognition not supported";
        } else {
            const recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = "en-US";

            micBtn.addEventListener("click", () => {
                recognition.start();
                micBtn.innerText = "🎙";
            });

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                input.value = transcript;

                if (event.results[event.results.length - 1].isFinal) {
                    recognition.stop();
                    micBtn.innerText = "🎤";
                    handleMessage();
                }
            };

            recognition.onerror = (event) => {
                console.error("Speech recognition error:", event.error);
                recognition.stop();
                micBtn.innerText = "🎤";
            };

            recognition.onend = () => {
                micBtn.innerText = "🎤";
            };
        }

        const input = document.querySelector(".chat-footer input");
        const sendBtn = document.querySelector(".send-btn");
        const chatContainer = document.querySelector(".chat-container");

        sendBtn.addEventListener("click", handleMessage);

        input.addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                e.preventDefault();
                handleMessage();
            }
        });

        function handleMessage() {
            const userMessage = input.value.trim();
            if (userMessage === "") return;

            appendMessage(userMessage, "user");
            input.value = "";

            fetchGeminiResponse(userMessage);
        }

        function appendMessage(text, sender) {
            const messageDiv = document.createElement("div");
            messageDiv.classList.add("message", sender);
            messageDiv.innerText = text;
            chatContainer.insertBefore(messageDiv, document.querySelector(".chat-footer"));
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function fetchGeminiResponse(prompt) {
            appendMessage("Typing...", "bot");

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${GEMINI_API_KEY}`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: prompt
                            }]
                        }]
                    })
                });

                const data = await response.json();

                document.querySelectorAll(".message.bot").forEach(el => {
                    if (el.innerText === "Typing...") el.remove();
                });

                const reply = data ? .candidates ? .[0] ? .content ? .parts ? .[0] ? .text || "Sorry, I didn't understand that.";
                appendMessage(reply, "bot");

            } catch (error) {
                console.error("Error:", error);
                appendMessage("Something went wrong. Please try again.", "bot");
            }
        }
    </script>
</body>

</html>
