<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Auction Ride</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jwt-decode@3.1.2/build/jwt-decode.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">

</head>


<body>
    <div class="form-wrapper">
        <div class="form-box login-box active" id="loginBox">
            <h2>Welcome Back To Auction Ride</h2>
            <input type="email" placeholder="Email Address" id="loginEmail" required />
            <div id="loginEmailError" class="error-message"></div>
            <div class="password-wrapper">
                <input type="password" placeholder="Password" id="loginPassword" required />
                <i id="eyeIconLogin" class="fas fa-eye toggle-eye" onclick="togglePasswordVisibility('loginPassword', 'eyeIconLogin')"></i>
            </div>
            <div id="loginPasswordError" class="error-message"></div>
            <button type="button" onclick="validateLogin()">Login</button>
            <div class="g_id_signin" data-type="standard" data-shape="pill" data-theme="outline" data-text="sign_in_with" data-size="large" data-logo_alignment="left">
            </div>
            <div class="switch-link">
                Don’t have an account? <a onclick="toggleForm()">Sign Up</a>
            </div>
        </div>

        <div class="form-box signup-box" id="signupBox">
            <h2>Create an Account</h2>
            <input type="text" placeholder="Full Name" id="signupName" required />
            <div id="signupNameError" class="error-message"></div>
            <input type="email" placeholder="Email Address" id="signupEmail" required />
            <div id="signupEmailError" class="error-message"></div>
            <div class="password-wrapper">
                <input type="password" placeholder="Password" id="signupPassword" required />
                <i id="eyeIconSignup" class="fas fa-eye toggle-eye" onclick="togglePasswordVisibility('signupPassword', 'eyeIconSignup')"></i>
            </div>
            <div id="signupPasswordError" class="error-message"></div>
            <button type="button" onclick="validateSignup()">Sign Up</button>
            <div class="switch-link">
                Already have an account? <a onclick="toggleForm()">Login</a>
            </div>
        </div>
    </div>



    <div id="g_id_onload" data-client_id="149237752978-thtrp527mbnie638lnvdtjeamqnr154e.apps.googleusercontent.com" data-callback="handleGoogleResponse" data-auto_prompt="false">
    </div>

    <script src="{{ url_for('static', filename='login.js') }}"></script>

</body>

</html>
